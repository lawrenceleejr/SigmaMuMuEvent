<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<!-- Added to a phone's home screen this runs without the browser's own bars,
     which is as close to full screen as an iPhone gets: Safari there has no
     Fullscreen API to ask. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>{{ .Title }}</title>
<link rel="icon" href="{{ "favicon.svg" | relURL }}" type="image/svg+xml">
<link rel="stylesheet" href="{{ "fonts/fonts.css" | relURL }}">
<style>
  /* The banner's palette, read as a negative — this is a room with the lights
     down and a projector on. */
  :root {
    --paper: #141312;
    --ink: #efe9da;
    --accent: #ff5230;
    --muted: #9b948a;
    --sans: Archivo, "Helvetica Neue", Arial, sans-serif;
  }
  * { margin: 0; box-sizing: border-box; }
  html, body { height: 100dvh; overflow: hidden; background: var(--paper); }
  body { font-family: var(--sans); color: var(--ink); }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; }

  /* The banner's two washes. There the type sits on the left, so the main one
     runs across; here it sits along the top, so it runs down — same job, same
     stops, turned to face the type. The second holds the foot of the frame for
     the announcement, exactly as it does on the banner. */
  #veil, #veil2 { position: fixed; inset: 0; z-index: 2; pointer-events: none; }
  #veil {
    background: linear-gradient(170deg,
      rgba(20, 19, 18, 0.94) 0%, rgba(20, 19, 18, 0.82) 24%,
      rgba(20, 19, 18, 0.1) 44%, rgba(20, 19, 18, 0.1) 74%,
      rgba(20, 19, 18, 0.26) 100%);
  }
  #veil2 {
    background: linear-gradient(0deg,
      rgba(20, 19, 18, 0.82) 0%, rgba(20, 19, 18, 0) 30%);
  }

  #type {
    position: fixed; inset: 0; z-index: 3;
    padding: 5.2vh 4.4vw;
    display: flex; flex-direction: column;
    pointer-events: none;
  }
  .kicker {
    color: var(--accent);
    font-size: 2.05vw; font-weight: 700;
    letter-spacing: 0.22em; text-transform: uppercase;
  }
  h1 {
    margin-top: 1.6vh;
    font-size: 4.4vw; font-weight: 800;
    line-height: 1.02; letter-spacing: -0.022em;
    max-width: 62vw;
  }
  .rule {
    margin-top: 3.4vh;
    width: 100%; max-width: 78vw;
    height: max(2px, 0.45vh);
    background: var(--accent);
  }
  /* Stacked, both on the left edge the kicker, the title and the rule share.
     Set across from each other the URL had nothing to align to and floated in
     the middle of the frame. */
  .foot {
    display: flex; flex-direction: column; align-items: flex-start;
    gap: 0.5vh; max-width: 78vw; margin-top: 1.9vh;
    font-size: 1.5vw; font-weight: 600;
    letter-spacing: 0.09em; text-transform: uppercase;
  }
  .foot > span { white-space: nowrap; }
  .url { opacity: 0.78; letter-spacing: 0.06em; text-transform: none; }
  /* The official mark, on the far side from the type. White artwork tinted by
     its own alpha, the way render/banner.mjs tints it — so it tracks the
     palette instead of drifting from it. */
  #mark {
    position: fixed; z-index: 3;
    top: 5.2vh; right: 4.4vw;
    width: 9.5vw; height: 11vh;
    background: var(--ink);
    -webkit-mask: url({{ "img/usmcc-mark-white.png" | relURL }}) no-repeat right top / contain;
    mask: url({{ "img/usmcc-mark-white.png" | relURL }}) no-repeat right top / contain;
    pointer-events: none;
  }

  /* The announcement. Empty by default, so what is on screen is the banner. */
  #say-wrap {
    position: fixed; z-index: 3; left: 0; right: 0; bottom: 8vh;
    display: none; justify-content: center; padding: 0 7vw;
    pointer-events: none;
  }
  body.has-say #say-wrap { display: flex; }
  #say {
    max-width: 86vw;
    font-weight: 800; line-height: 1.06; letter-spacing: -0.015em;
    text-align: center; text-wrap: balance;
  }

  /* Controls. They are chrome, so they sit quietly at the bottom and are gone
     while presenting — not faded, gone, since a phone has no Fullscreen API
     to hide them for us and a half-transparent bar is still a bar. */
  #bar {
    position: fixed; z-index: 4; left: 0; right: 0; bottom: 0;
    display: flex; gap: 0.8rem; align-items: center; justify-content: center;
    padding: 1rem 1.2rem;
    background: rgba(12, 11, 11, 0.86);
    border-top: 1px solid rgba(239, 233, 218, 0.14);
    transition: opacity 0.25s ease, transform 0.25s ease;
  }
  body.present #bar { display: none; }
  body.present { cursor: none; -webkit-user-select: none; user-select: none; }

  #say-input {
    flex: 1 1 34rem; max-width: 44rem;
    padding: 0.6rem 0.8rem;
    background: rgba(239, 233, 218, 0.06);
    color: var(--ink);
    border: 1px solid rgba(239, 233, 218, 0.24);
    border-radius: 0;
    font-family: var(--sans); font-size: 1rem;
  }
  #say-input::placeholder { color: var(--muted); }
  #say-input:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }
  #fs, #music {
    padding: 0.65em 1.4em;
    background: var(--ink); color: var(--paper);
    border: 0; border-radius: 0; cursor: pointer;
    font-family: var(--sans); font-size: 0.82rem; font-weight: 700;
    letter-spacing: 0.14em; text-transform: uppercase;
  }
  #fs:hover, #music:hover { background: var(--accent); color: var(--ink); }
  #music { background: none; color: var(--ink); border: 1px solid rgba(239, 233, 218, 0.24); }
  .hint { color: var(--muted); font-size: 0.78rem; letter-spacing: 0.04em; }
  @media (max-width: 700px) { .hint { display: none; } }

  /* Held in portrait — a phone, not the room screen. The type is sized off
     the width, which on a tall frame leaves it far too small to read, so it
     takes a larger share of it and the footline stacks instead of spanning. */
  @media (max-aspect-ratio: 1 / 1) {
    #type { padding: 4vh 5vw; }
    .kicker { font-size: 3.4vw; }
    /* Narrow enough to clear the mark in the corner rather than run under it. */
    h1 { font-size: 6vw; max-width: 72vw; margin-top: 1.2vh; }
    .rule { max-width: 100%; margin-top: 2.6vh; }
    .foot { gap: 0.35em; font-size: 2.9vw; margin-top: 1.4vh; max-width: 100%; }
    #mark { width: 17vw; height: 8vh; top: 4vh; right: 5vw; }
    #say-wrap { padding: 0 5vw; }
    #bar { flex-wrap: wrap; }
  }
</style>
</head>
<body>

<canvas id="live" aria-hidden="true"></canvas>
<div id="veil" aria-hidden="true"></div>
<div id="veil2" aria-hidden="true"></div>

<div id="type">
  <div class="kicker">{{ .Params.kicker }}</div>
  <h1>{{ .Params.heading | safeHTML }}</h1>
  <div class="rule"></div>
  <div class="foot">
    <span class="where">{{ .Params.where }}</span>
    <span class="url">{{ .Params.url }}</span>
  </div>
</div>
<div id="mark" aria-hidden="true"></div>

<div id="say-wrap"><div id="say"></div></div>

<div id="bar">
  <input id="say-input" type="text" autocomplete="off" spellcheck="false"
         placeholder="Announcement — e.g. Back at 10:45, Parallel B moved to Redwood">
  <button id="fs" type="button">Full screen</button>
  <button id="music" type="button" hidden>Music: on</button>
  <span class="hint">Tap or press Esc to come back</span>
</div>

{{ with .Params.music_playlist }}
{{ if $.Params.music_token }}
<!-- Apple Music. Only loaded when this page has been given a developer token
     and a playlist; blank either and nothing here is emitted at all. -->
<!-- No jsonify: Go's templates already escape a string into a JS string
     literal inside a script block, and jsonifying first quotes it twice, so
     the token would reach Apple with quote marks inside it. -->
<script>window.SMM_MUSIC = {
  token: {{ $.Params.music_token }},
  playlist: {{ . }},
  name: {{ site.Title }}
};</script>
<script src="https://js-cdn.music.apple.com/musickit/v3/musickit.js" async></script>
{{ end }}
{{ end }}
{{ if eq .Params.diagram false }}
<script>window.SMM_BG_DIAGRAM = false;</script>
{{ end }}
<script src="{{ "js/network.js" | relURL }}"></script>
<script src="{{ "js/vbf.js" | relURL }}"></script>
<script src="{{ "js/bg.js" | relURL }}" defer></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>{{ .Title }}</title>
<link rel="icon" href="{{ "favicon.svg" | relURL }}" type="image/svg+xml">
<link rel="stylesheet" href="{{ "fonts/fonts.css" | relURL }}">
<style>
  /* The banner's palette, read as a negative — this is a room with the lights
     down and a projector on. */
  :root {
    --paper: #141312;
    --ink: #efe9da;
    --accent: #ff5230;
    --muted: #9b948a;
    --sans: Archivo, "Helvetica Neue", Arial, sans-serif;
  }
  * { margin: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: var(--paper); }
  body { font-family: var(--sans); color: var(--ink); }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; }
  #live { z-index: 0; }
  #still { z-index: 1; }

  /* The banner's two washes. There the type sits on the left, so the main one
     runs across; here it sits along the top, so it runs down — same job, same
     stops, turned to face the type. The second holds the foot of the frame for
     the announcement, exactly as it does on the banner. */
  #veil, #veil2 { position: fixed; inset: 0; z-index: 2; pointer-events: none; }
  #veil {
    background: linear-gradient(170deg,
      rgba(20, 19, 18, 0.94) 0%, rgba(20, 19, 18, 0.82) 24%,
      rgba(20, 19, 18, 0.1) 44%, rgba(20, 19, 18, 0.1) 74%,
      rgba(20, 19, 18, 0.26) 100%);
  }
  #veil2 {
    background: linear-gradient(0deg,
      rgba(20, 19, 18, 0.82) 0%, rgba(20, 19, 18, 0) 30%);
  }

  #type {
    position: fixed; inset: 0; z-index: 3;
    padding: 5.2vh 4.4vw;
    display: flex; flex-direction: column;
    pointer-events: none;
  }
  .kicker {
    color: var(--accent);
    font-size: 2.05vw; font-weight: 700;
    letter-spacing: 0.22em; text-transform: uppercase;
  }
  h1 {
    margin-top: 1.6vh;
    font-size: 4.4vw; font-weight: 800;
    line-height: 1.02; letter-spacing: -0.022em;
    max-width: 62vw;
  }
  .rule {
    margin-top: 3.4vh;
    width: 100%; max-width: 78vw;
    height: max(2px, 0.45vh);
    background: var(--accent);
  }
  .foot {
    display: flex; justify-content: space-between; align-items: baseline;
    gap: 2em; max-width: 78vw; margin-top: 1.9vh;
    font-size: 1.5vw; font-weight: 600;
    letter-spacing: 0.09em; text-transform: uppercase;
  }
  .foot > span { white-space: nowrap; }
  .url { opacity: 0.78; letter-spacing: 0.06em; text-transform: none; }
  /* The official mark, on the far side from the type. White artwork tinted by
     its own alpha, the way render/banner.mjs tints it — so it tracks the
     palette instead of drifting from it. */
  #mark {
    position: fixed; z-index: 3;
    top: 5.2vh; right: 4.4vw;
    width: 9.5vw; height: 11vh;
    background: var(--ink);
    -webkit-mask: url({{ "img/usmcc-mark-white.png" | relURL }}) no-repeat right top / contain;
    mask: url({{ "img/usmcc-mark-white.png" | relURL }}) no-repeat right top / contain;
    pointer-events: none;
  }

  /* The announcement. Empty by default, so what is on screen is the banner. */
  #say-wrap {
    position: fixed; z-index: 3; left: 0; right: 0; bottom: 8vh;
    display: none; justify-content: center; padding: 0 7vw;
    pointer-events: none;
  }
  body.has-say #say-wrap { display: flex; }
  #say {
    max-width: 86vw;
    font-weight: 800; line-height: 1.06; letter-spacing: -0.015em;
    text-align: center; text-wrap: balance;
  }

  /* Controls. They are chrome, so they sit quietly at the bottom and go away
     entirely in full screen — a mouse move brings them back for a moment, so
     an announcement can be typed without dropping out of it. */
  #bar {
    position: fixed; z-index: 4; left: 0; right: 0; bottom: 0;
    display: flex; gap: 0.8rem; align-items: center; justify-content: center;
    padding: 1rem 1.2rem;
    background: rgba(12, 11, 11, 0.86);
    border-top: 1px solid rgba(239, 233, 218, 0.14);
    transition: opacity 0.25s ease, transform 0.25s ease;
  }
  body.full #bar { opacity: 0; transform: translateY(100%); pointer-events: none; }
  body.full.peek #bar { opacity: 1; transform: none; pointer-events: auto; }
  #say-input {
    flex: 1 1 34rem; max-width: 44rem;
    padding: 0.6rem 0.8rem;
    background: rgba(239, 233, 218, 0.06);
    color: var(--ink);
    border: 1px solid rgba(239, 233, 218, 0.24);
    border-radius: 0;
    font-family: var(--sans); font-size: 1rem;
  }
  #say-input::placeholder { color: var(--muted); }
  #say-input:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }
  #fs {
    padding: 0.65em 1.4em;
    background: var(--ink); color: var(--paper);
    border: 0; border-radius: 0; cursor: pointer;
    font-family: var(--sans); font-size: 0.82rem; font-weight: 700;
    letter-spacing: 0.14em; text-transform: uppercase;
  }
  #fs:hover { background: var(--accent); color: var(--ink); }
  .hint { color: var(--muted); font-size: 0.78rem; letter-spacing: 0.04em; }
  @media (max-width: 700px) { .hint { display: none; } }
</style>
</head>
<body>

<canvas id="live" aria-hidden="true"></canvas>
<canvas id="still" aria-hidden="true"></canvas>
<div id="veil" aria-hidden="true"></div>
<div id="veil2" aria-hidden="true"></div>

<div id="type">
  <div class="kicker">{{ .Params.kicker }}</div>
  <h1>{{ .Params.heading | safeHTML }}</h1>
  <div class="rule"></div>
  <div class="foot">
    <span class="where">{{ .Params.where }}</span>
    <span class="url">{{ .Params.url }}</span>
  </div>
</div>
<div id="mark" aria-hidden="true"></div>

<div id="say-wrap"><div id="say"></div></div>

<div id="bar">
  <input id="say-input" type="text" autocomplete="off" spellcheck="false"
         placeholder="Announcement — e.g. Back at 10:45, Parallel B moved to Redwood">
  <button id="fs" type="button">Full screen</button>
  <span class="hint">Esc leaves full screen</span>
</div>

<script src="{{ "js/network.js" | relURL }}"></script>
<script src="{{ "js/vbf.js" | relURL }}"></script>
<script src="{{ "js/bg.js" | relURL }}" defer></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} — {{ site.Title }}{{ end }}</title>
<meta name="description" content="{{ site.Params.description }}">
<meta property="og:title" content="{{ site.Title }}">
<meta property="og:description" content="{{ site.Params.description }}">
<meta property="og:type" content="website">
<link rel="icon" href="{{ "favicon.svg" | relURL }}" type="image/svg+xml">
<link rel="stylesheet" href="{{ "fonts/fonts.css" | relURL }}">
{{ $css := resources.Get "css/main.css" | minify | fingerprint }}
<link rel="stylesheet" href="{{ $css.RelPermalink }}" integrity="{{ $css.Data.Integrity }}">
</head>
<body>

<!-- the field is fixed; everything else scrolls over it -->
<canvas id="field" aria-hidden="true"></canvas>
<div id="grain" aria-hidden="true"></div>

{{ block "main" . }}{{ end }}

<script src="{{ "js/network.js" | relURL }}"></script>
<script src="{{ "js/field.js" | relURL }}" defer></script>
</body>
</html>

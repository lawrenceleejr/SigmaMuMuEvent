baseURL = "https://hepalumni.muoncollider.us/"
languageCode = "en-gb"
title = "σμμ — A Particle Physics Alumni Reunion"

# The poster's own artwork is the identity; no theme.
disableKinds = ["taxonomy", "term", "RSS"]
enableRobotsTXT = true

[markup.goldmark.renderer]
  unsafe = true

# Lets a heading name its own anchor: "## Heading {#short-id}". Without this
# the ids are slugs of the full heading text, which are clumsy to share.
[markup.goldmark.parser.attribute]
  block = true

[params]
  # Shown under the link wherever the site is pasted, so it is written to be
  # read cold: what it is, when, where. The old wording led with people having
  # left the field, which is not how the invitation talks about them.
  description = "Old friends, new physics. A cocktail hour and research fair for HEP alumni and the colleagues we miss. Sunday, December 13, 2026, at Stanford University."

  # Cloudflare Web Analytics. Cookieless, so no consent banner is needed.
  # The token is a public site identifier, not a secret. Blank it to switch
  # the beacon off; the tag disappears from the built pages entirely.
  cloudflare_analytics_token = "a2404cc8fdd04d4d81b1abdada7e1eb2"
